[pytest]
# Asyncio test configuration: auto recognizes async test functions
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Where pytest should look for test files
testpaths = tests

# Add backend directory to Python path so 'app.*' imports work without PYTHONPATH hacks
pythonpath = .

# Display concise, readable output
addopts = -v -s
